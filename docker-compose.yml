services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinelops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelops_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinelops} -d ${POSTGRES_DB:-sentinelops}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelops-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: SentinelOps
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-strong-random-secret-key-at-least-32-chars}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173,http://localhost}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinelops}:${POSTGRES_PASSWORD:-sentinelops_dev_password}@postgres:5432/${POSTGRES_DB:-sentinelops}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@sentinelops.local}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Admin@SentinelOps123!}
      DEFAULT_MONITORING_INTERVAL_SECONDS: ${DEFAULT_MONITORING_INTERVAL_SECONDS:-5}
      SERVER_OFFLINE_THRESHOLD_SECONDS: ${SERVER_OFFLINE_THRESHOLD_SECONDS:-30}
      DEFAULT_METRIC_RETENTION_DAYS: ${DEFAULT_METRIC_RETENTION_DAYS:-30}
      DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: sentinelops-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 20s
      timeout: 3s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: sentinelops-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  # Optional Demo Simulator (start with: docker compose --profile demo up --build)
  demo-simulator:
    build:
      context: ./monitoring-agent
      dockerfile: Dockerfile
    container_name: sentinelops-demo-simulator
    profiles: ["demo"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DEMO_API_URL: http://backend:8000
      DEMO_INTERVAL_SECONDS: ${DEMO_INTERVAL_SECONDS:-5}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Admin@SentinelOps123!}
    command: ["python", "demo_simulator.py"]

volumes:
  postgres_data:

